name: Security Pipeline

on:
  push:
    branches: [secure, main]
  pull_request:
    branches: [secure, main]

env:
  JWT_SECRET: ci-test-secret-minimum-32-characters-long!!
  NODE_ENV: test
  CORS_ORIGIN: http://localhost:3000

jobs:
  test:
    name: Tests applicatifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Lancer les tests backend
        working-directory: backend
        run: npm test

      - name: Lancer les tests frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            .semgrep.yml

  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer et démarrer le backend
        working-directory: backend
        run: |
          npm ci
          npm run seed
          node src/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health; then
              echo "Backend prêt"
              exit 0
            fi
            sleep 2
          done
          echo "Le backend n'a pas démarré"
          exit 1
        env:
          PORT: 3001

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3001
          allow_issue_writing: false
          cmd_options: '-a'
